services:
  cinema_foraneo_sql:
    image: mysql:8.0
    container_name: cinema_foraneo_sql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "4000:3306"
    volumes:
      - ./storage/database:/var/lib/mysql
    networks:
      - cinema_foraneo_network

  cinema_foraneo_backend:
    image: python:3.11-slim
    container_name: cinema_foraneo_backend
    working_dir: /app
    volumes:
      - ../back:/app
    command: >
      sh -c "apt-get update && apt-get install -y netcat-traditional &&
             pip install fastapi uvicorn mysql-connector-python python-dotenv passlib python-jose[cryptography] bcrypt email-validator &&
             while ! nc -z cinema_foraneo_sql 3306; do echo 'Waiting for database...'; sleep 2; done &&
             echo 'Database is ready!' &&
             uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      - "5000:8000"
    depends_on:
      - cinema_foraneo_sql
    environment:
      - MYSQL_HOST=cinema_foraneo_sql
      - DB_HOST_NAME=cinema_foraneo_sql
      - DB_HOST_PORT=3306
      - DB_USER_NAME=root
      - DB_PASSWORD=root
      - DB_NAME=cinema_foraneo_db
    networks:
      - cinema_foraneo_network

networks:
  cinema_foraneo_network:
    driver: bridge
